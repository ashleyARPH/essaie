<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Objectifs">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F1EAE0">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Objectifs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink: #4A3B47;
    --ink-dim: #9C8A96;
    --bg-deep: #F1EAE0;
    --bg-panel: #FBF7F2;
    --bg-panel-2: #F3E6F1;
    --gold: #CAA3D6;
    --coral: #B98BC9;
    --sage: #CAA3D6;
    --line: rgba(74,59,71,0.12);
    --radius: 18px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(120% 100% at 50% 0%, #F7F1EA 0%, var(--bg-deep) 55%, #E9DED0 100%);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  #app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  header.top{
    padding:28px 22px 16px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:3px;
    position:relative;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:0.2px;
    cursor:pointer;
  }
  header.top h1 input{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px; letter-spacing:0.2px;
    background:none; border:none; border-bottom:2px solid var(--gold); color:var(--ink);
    width:100%; padding:0; outline:none;
  }
  header.top .sub{
    font-size:12.5px;
    color:var(--ink-dim);
  }
  .sync-dot{
    width:8px; height:8px; border-radius:50%; background:#6FBF8B; flex-shrink:0;
    box-shadow:0 0 0 3px rgba(111,191,139,0.18);
    position:absolute; top:34px; right:22px;
  }
  .sync-dot.offline{ background:var(--ink-dim); box-shadow:none; }
  .back-btn{
    background:none; border:none; color:var(--ink); font-size:22px; cursor:pointer; padding:2px 6px 2px 0;
  }
  header.top .title-row{display:flex; align-items:center; gap:8px;}

  main{
    flex:1;
    padding:6px 18px 110px;
    overflow-y:auto;
  }

  .view{display:none;}
  .view.active{display:block; animation: fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}

  .section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.4px;
    color:var(--sage);
    margin:22px 0 10px;
    font-weight:600;
  }
  .section-label:first-child{margin-top:0;}

  /* ---- Goal card ---- */
  .goal-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    display:flex;
    gap:14px;
    align-items:center;
    cursor:pointer;
    transition:border-color .15s;
  }
  .goal-card:active{border-color:var(--gold);}
  .goal-ring{position:relative; width:52px; height:52px; flex-shrink:0;}
  .goal-ring svg{transform:rotate(-90deg);}
  .goal-ring .emoji{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px;}
  .goal-body{flex:1; min-width:0;}
  .goal-body h4{margin:0 0 3px; font-size:15px; font-weight:600; font-family:'Fraunces', serif;}
  .goal-body .meta{font-size:11.5px; color:var(--ink-dim);}
  .goal-body .bar-track{height:5px; background:rgba(74,59,71,0.08); border-radius:4px; margin-top:8px; overflow:hidden;}
  .goal-body .bar-fill{height:100%; border-radius:4px; background:linear-gradient(90deg, var(--gold), var(--coral));}
  .chev{color:var(--ink-dim); font-size:18px; flex-shrink:0;}
  .reorder-col{display:flex; flex-direction:column; gap:3px; flex-shrink:0;}
  .reorder-btn{
    width:24px; height:19px; border:none; background:var(--bg-panel-2); color:var(--ink-dim);
    border-radius:5px; font-size:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .reorder-btn:active{background:var(--gold); color:var(--ink);}

  /* ---- Countdown card ---- */
  .cd-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    display:flex;
    gap:14px;
    align-items:center;
  }
  .cd-badge{
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    border:2px solid; position:relative;
  }
  .cd-body{flex:1; min-width:0;}
  .cd-body h4{margin:0 0 3px; font-size:15px; font-weight:600; font-family:'Fraunces', serif;}
  .cd-body .meta{font-size:11.5px; color:var(--ink-dim);}
  .cd-days{text-align:right; flex-shrink:0;}
  .cd-days .num{font-family:'Fraunces', serif; font-size:20px; font-weight:600; line-height:1;}
  .cd-days .lbl{font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px;}

  /* ---- calendar filters ---- */
  .filter-chips{display:flex; gap:8px; margin-bottom:16px;}
  .filter-chip{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--ink-dim);
    padding:8px 14px; border-radius:20px; font-size:12.5px; cursor:pointer; font-family:'Inter'; font-weight:500;
  }
  .filter-chip.active{background:var(--gold); border-color:var(--gold); color:var(--ink);}
  .cal-view-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .cal-toggle-btn{
    flex:1; background:var(--bg-panel); border:1px solid var(--line); color:var(--ink-dim);
    padding:10px 8px; border-radius:12px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter';
  }
  .cal-toggle-btn.active{background:var(--gold); border-color:var(--gold); color:var(--ink);}

  /* ---- goal detail header ---- */
  .detail-hero{
    background: linear-gradient(155deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line);
    border-radius:22px;
    padding:22px;
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:20px;
  }
  .detail-hero .goal-ring{width:64px; height:64px;}
  .detail-hero .goal-ring .emoji{font-size:24px;}
  .detail-hero h2{font-family:'Fraunces', serif; margin:0 0 4px; font-size:19px;}
  .detail-hero .meta{font-size:12px; color:var(--ink-dim);}

  /* ---- Task row ---- */
  .task-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:9px;
  }
  .checkbox{
    width:22px; height:22px; border-radius:50%;
    border:2px solid var(--sage);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: all .18s ease;
  }
  .checkbox.done{ background:var(--sage); border-color:var(--sage); }
  .checkbox svg{width:12px; height:12px; opacity:0; transition:opacity .15s;}
  .checkbox.done svg{opacity:1;}
  .task-txt{flex:1; min-width:0;}
  .task-txt .title{font-size:14.5px; font-weight:500;}
  .task-txt .title.done{ text-decoration:line-through; color:var(--ink-dim); }
  .task-txt .tag{font-size:11px; margin-top:2px; font-weight:500;}
  .del-btn{
    background:none; border:none; color:var(--ink-dim); font-size:18px; padding:4px 6px; cursor:pointer; line-height:1;
  }
  .add-task-inline{
    width:100%; padding:13px; border-radius:14px; border:1px dashed var(--line); background:none;
    color:var(--ink-dim); font-size:13.5px; cursor:pointer; margin-top:4px;
  }

  /* ---- photo picker ---- */
  .photo-add-btn{
    width:100%; padding:13px; border-radius:14px; border:1px dashed var(--line); background:none;
    color:var(--ink-dim); font-size:13.5px; cursor:pointer; font-family:'Inter';
  }
  .photo-add-btn:disabled{opacity:0.6;}
  .visually-hidden-input{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .photo-preview{position:relative; width:100%; height:140px; border-radius:14px; overflow:hidden; margin-bottom:8px;}
  .photo-preview img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-remove{
    position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%;
    background:rgba(74,59,71,0.55); color:#fff; border:none; font-size:14px; cursor:pointer;
  }
  .card-thumb{width:40px; height:40px; border-radius:10px; object-fit:cover; flex-shrink:0;}
  .detail-photo{width:100%; height:160px; border-radius:18px; object-fit:cover; margin-bottom:14px; display:block;}

  .empty{
    text-align:center; padding:40px 20px; color:var(--ink-dim); font-size:13.5px; line-height:1.6;
  }
  .empty .big{font-size:34px; display:block; margin-bottom:10px;}

  /* ---- FAB ---- */
  .fab{
    position:absolute; right:20px; bottom:96px;
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg, var(--gold), var(--coral));
    border:none; color:var(--ink);
    font-size:26px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 24px rgba(202,163,214,0.45);
    cursor:pointer;
  }

  /* ---- bottom nav ---- */
  nav.bottom{
    position:sticky; bottom:0;
    display:flex;
    background:rgba(241,234,224,0.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--ink-dim);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10.5px; font-family:'Inter'; cursor:pointer; padding:4px;
  }
  nav.bottom button .icon{font-size:19px;}
  nav.bottom button.active{color:var(--gold);}

  /* ---- calendar ---- */
  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .cal-header .cal-title{font-family:'Fraunces', serif; font-size:17px; font-weight:600; text-transform:capitalize;}
  .cal-nav-btn{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--ink);
    width:32px; height:32px; border-radius:9px; font-size:15px; cursor:pointer;
  }
  .cal-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
    font-size:10.5px; color:var(--ink-dim); margin-bottom:6px; letter-spacing:0.5px;
  }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:5px;
  }
  .cal-day{
    aspect-ratio:1; border-radius:11px; background:var(--bg-panel); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    cursor:pointer; position:relative; padding:2px;
  }
  .cal-day.empty{background:none; border:none; cursor:default;}
  .cal-day.today{border-color:var(--gold);}
  .cal-day .num{font-size:12px; color:var(--ink);}
  .cal-day .dots{display:flex; gap:2px; flex-wrap:wrap; justify-content:center; max-width:100%;}
  .cal-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .cal-dot.pending{background:none; border:1.5px solid;}
  .cal-dot.cd{border-radius:2px; transform:rotate(45deg); width:5.5px; height:5.5px;}

  .legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:18px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-dim);}
  .legend-swatch{width:9px; height:9px; border-radius:50%; flex-shrink:0;}

  .day-sheet-list .task-row{margin-bottom:8px;}
  .day-sheet-empty{text-align:center; color:var(--ink-dim); font-size:13px; padding:20px 0;}

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(74,59,71,0.35);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    width:100%; max-width:430px;
    background:var(--bg-panel-2);
    border-radius:24px 24px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    animation: slideup .22s ease;
    border:1px solid var(--line);
    border-bottom:none;
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0} to{transform:translateY(0); opacity:1}}
  .sheet h3{font-family:'Fraunces', serif; margin:0 0 16px; font-size:19px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--ink-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.6px;}
  .field input, .field select{
    width:100%; background:var(--bg-deep); border:1px solid var(--line); color:var(--ink);
    padding:11px 12px; border-radius:11px; font-size:14.5px; font-family:'Inter';
  }
  .autocomplete-field{position:relative;}
  .autocomplete-list{
    position:absolute; left:0; right:0; top:calc(100% + 4px);
    background:var(--bg-panel); border:1px solid var(--line); border-radius:11px;
    max-height:170px; overflow-y:auto; z-index:20; display:none;
    box-shadow:0 10px 24px rgba(74,59,71,0.18);
  }
  .autocomplete-list.open{display:block;}
  .autocomplete-item{padding:11px 12px; font-size:14px; cursor:pointer;}
  .autocomplete-item:active{background:var(--bg-panel-2);}
  .emoji-picker{display:flex; gap:8px; flex-wrap:wrap;}
  .emoji-picker button{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--bg-deep);
    font-size:17px; cursor:pointer;
  }
  .emoji-picker button.sel{border-color:var(--gold); background:rgba(202,163,214,0.25);}
  .color-picker{display:flex; gap:10px; flex-wrap:wrap;}
  .color-picker button{
    width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0;
  }
  .color-picker button.sel{border-color:var(--ink); box-shadow:0 0 0 2px var(--bg-panel-2);}
  .edit-goal-btn{
    background:none; border:none; color:var(--ink-dim); font-size:18px; cursor:pointer; padding:6px; align-self:flex-start;
  }
  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .btn{
    flex:1; padding:12px; border-radius:12px; border:none; font-size:14px; font-weight:600; cursor:pointer; font-family:'Inter';
  }
  .btn.primary{background:linear-gradient(135deg, var(--gold), var(--coral)); color:var(--ink);}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--ink-dim);}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="title-row">
      <button class="back-btn" id="backBtn" style="display:none;">←</button>
      <h1 id="headerTitle" class="editable-title"></h1>
    </div>
    <div class="sub" id="headerSub"></div>
    <span class="sync-dot" id="syncDot" title="Synchronisation"></span>
  </header>

  <main>
    <!-- OBJECTIFS (liste) -->
    <section class="view active" id="view-goals">
      <div class="filter-chips" id="goalsFilterChips" style="display:none;"></div>
      <div id="goalsList"></div>
    </section>

    <!-- DETAIL D'UN OBJECTIF -->
    <section class="view" id="view-goal-detail">
      <img class="detail-photo" id="detailPhoto" style="display:none;" alt="">
      <div class="detail-hero" id="detailHero"></div>
      <button class="edit-goal-btn" id="editGoalBtn" style="margin:-14px 0 6px;">✎ Modifier l'objectif</button>
      <div class="section-label">Étapes</div>
      <div id="detailTaskList"></div>
      <button class="add-task-inline" id="addTaskInlineBtn">+ Ajouter une étape</button>
    </section>

    <!-- COMPTES À REBOURS -->
    <section class="view" id="view-countdowns">
      <div class="filter-chips" id="cdFilterChips" style="display:none;"></div>
      <div id="countdownsList"></div>
    </section>

    <!-- CALENDRIER -->
    <section class="view" id="view-calendar">
      <div class="filter-chips">
        <button class="filter-chip active" id="filterGoals">🎯 Objectifs</button>
        <button class="filter-chip active" id="filterCountdowns">⏳ Comptes à rebours</button>
      </div>
      <div class="cal-view-toggle">
        <button class="cal-toggle-btn active" id="calViewMonth">Mois</button>
        <button class="cal-toggle-btn" id="calViewAgenda">Agenda</button>
      </div>
      <div id="calMonthView">
        <div class="cal-header">
          <button class="cal-nav-btn" id="calPrev">‹</button>
          <div class="cal-title" id="calTitle"></div>
          <button class="cal-nav-btn" id="calNext">›</button>
        </div>
        <div class="cal-weekdays">
          <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="legend" id="calLegend"></div>
      </div>
      <div id="calAgendaView" style="display:none;">
        <div class="cal-header">
          <button class="cal-nav-btn" id="calPrevAgenda">‹</button>
          <div class="cal-title" id="calTitleAgenda"></div>
          <button class="cal-nav-btn" id="calNextAgenda">›</button>
        </div>
        <div id="calAgendaList"></div>
      </div>
    </section>
  </main>

  <button class="fab" id="fabBtn">+</button>

  <nav class="bottom">
    <button data-view="goals" class="active"><span class="icon">🎯</span>Objectifs</button>
    <button data-view="countdowns"><span class="icon">⏳</span>Comptes</button>
    <button data-view="calendar"><span class="icon">📅</span>Calendrier</button>
  </nav>
</div>

<!-- MODAL JOUR (liste des tâches d'un jour) -->
<div class="overlay" id="overlayDay">
  <div class="sheet">
    <h3 id="daySheetTitle">Jour</h3>
    <div class="day-sheet-list" id="daySheetList"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelDay">Fermer</button>
    </div>
  </div>
</div>

<!-- MODAL OBJECTIF -->
<div class="overlay" id="overlayGoal">
  <div class="sheet">
    <h3 id="goalSheetTitle">Nouvel objectif</h3>
    <div class="field">
      <label>Titre</label>
      <input type="text" id="goalTitle" placeholder="Ex. Lire 12 livres">
    </div>
    <div class="field autocomplete-field">
      <label>Catégorie (optionnel)</label>
      <input type="text" id="goalCategory" placeholder="Ex. Santé, Travail, Perso" autocomplete="off">
      <div class="autocomplete-list" id="goalCategoryList"></div>
    </div>
    <div class="field">
      <label>Date de début (optionnel)</label>
      <input type="date" id="goalStartDate">
    </div>
    <div class="field">
      <label>Date de fin (optionnel)</label>
      <input type="date" id="goalDate">
    </div>
    <div class="field">
      <label>Icône</label>
      <div class="emoji-picker" id="goalEmojiPicker"></div>
      <input type="text" id="goalEmojiCustom" placeholder="Ou tape un autre emoji ici" maxlength="8" style="margin-top:8px;">
    </div>
    <div class="field">
      <label>Couleur</label>
      <div class="color-picker" id="goalColorPicker"></div>
    </div>
    <div class="field">
      <label>Photo (optionnel)</label>
      <input type="file" accept="image/*" id="goalPhotoInput" class="visually-hidden-input">
      <div class="photo-preview" id="goalPhotoPreview" style="display:none;">
        <img id="goalPhotoImg">
        <button type="button" class="photo-remove" id="goalPhotoRemove">✕</button>
      </div>
      <button type="button" class="photo-add-btn" id="goalPhotoAddBtn">+ Ajouter une photo</button>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelGoal">Annuler</button>
      <button class="btn primary" id="saveGoal">Créer</button>
    </div>
  </div>
</div>

<!-- MODAL TÂCHE (toujours liée à un objectif) -->
<div class="overlay" id="overlayTask">
  <div class="sheet">
    <h3 id="taskSheetTitle">Nouvelle étape</h3>
    <div class="field" id="taskGoalField">
      <label>Objectif</label>
      <select id="taskGoal"></select>
    </div>
    <div class="field">
      <label>Titre</label>
      <input type="text" id="taskTitle" placeholder="Ex. Lire 20 pages">
    </div>
    <div class="field">
      <label>Date prévue (optionnel)</label>
      <input type="date" id="taskDate">
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelTask">Annuler</button>
      <button class="btn primary" id="saveTask">Créer</button>
    </div>
  </div>
</div>

<!-- MODAL COMPTE À REBOURS -->
<div class="overlay" id="overlayCountdown">
  <div class="sheet">
    <h3 id="cdSheetTitle">Nouveau compte à rebours</h3>
    <div class="field">
      <label>Titre</label>

const SYNC_KEY = 'pousse-state';

async function storageGet(key){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?key=eq.${encodeURIComponent(key)}&select=value`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    if(res.ok){
      const rows = await res.json();
      if(syncDot()) syncDot().classList.remove('offline');
      if(rows && rows.length){
        const val = JSON.stringify(rows[0].value);
        localStorage.setItem(key, val);
        return { value: val };
      }
      return null;
    }
  }catch(e){ /* pas de réseau : on retombe sur le cache local */ }
  if(syncDot()) syncDot().classList.add('offline');
  const v = localStorage.getItem(key);
  return v ? { value: v } : null;
}

async function storageSet(key, value){
  localStorage.setItem(key, value); // cache local immédiat, pour ne rien perdre hors-ligne
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify([{ key, value: JSON.parse(value), updated_at: new Date().toISOString() }])
    });
    if(syncDot()) syncDot().classList.toggle('offline', !res.ok);
  }catch(e){
    if(syncDot()) syncDot().classList.add('offline');
  }
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Compression échouée')), 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadPhoto(file){
  const blob = await compressImage(file, 1000, 0.8);
  const filename = uid() + '.jpg';
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${filename}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'image/jpeg'
    },
    body: blob
  });
  if(!res.ok) throw new Error('Échec de l\'envoi de la photo');
  return `${SUPABASE_URL}/storage/v1/object/public/photos/${filename}`;
}

function setupPhotoField(inputId, addBtnId, previewId, imgId, removeId, getUrl, setUrl){
  const input = $(inputId);
  const addBtn = $(addBtnId);
  const preview = $(previewId);
  const img = $(imgId);
  const removeBtn = $(removeId);

  addBtn.addEventListener('click', () => input.click());

  input.addEventListener('change', async () => {
    const file = input.files[0];
    if(!file) return;
    const localUrl = URL.createObjectURL(file);
    img.src = localUrl;
    preview.style.display = 'block';
    addBtn.style.display = 'none';
    addBtn.disabled = true;
    addBtn.textContent = 'Envoi en cours…';
    try{
      const publicUrl = await uploadPhoto(file);
      setUrl(publicUrl);
    }catch(e){
      alert("La photo n'a pas pu être envoyée. Vérifie ta connexion et réessaie.");
      preview.style.display = 'none';
      addBtn.style.display = 'block';
    }finally{
      addBtn.disabled = false;
      addBtn.textContent = '+ Ajouter une photo';

  });

  removeBtn.addEventListener('click', () => {

  });
}

  try{
    const r = await storageGet(SYNC_KEY);
    if(r && r.value) state = JSON.parse(r.value);
  }catch(e){ /* premier lancement, pas encore de données */ }
  if(!state.countdowns) state.countdowns = [];
  if(!state.goals) state.goals = [];

  state.countdowns.forEach((cd,i) => { if(cd.order === undefined) cd.order = i; });

async function saveState(){

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function fmtDate(d){
  return new Date(d).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
}
function dateRangeText(g, withYear){
  const opts = withYear ? {day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short'};
  const fmt = (d) => new Date(d).toLocaleDateString('fr-FR', opts);
  if(g.startDate && g.date) return `${fmt(g.startDate)} → ${fmt(g.date)}`;
  if(g.date) return `Jusqu'au ${fmt(g.date)}`;
  if(g.startDate) return `Depuis le ${fmt(g.startDate)}`;
  return 'Sans échéance';
}

function goalTasks(goalId){
  return state.tasks.filter(t => t.goalId === goalId);
}
function goalProgress(goal){
  const linked = goalTasks(goal.id);
  if(linked.length === 0) return 0;
  const done = linked.filter(t => t.done).length;
  return Math.round((done/linked.length)*100);
}

function reorderItem(list, categoryOf, id, direction){
  const item = list.find(x => x.id === id);
  if(!item) return;
  const cat = categoryOf(item) || null;
  const siblings = list.filter(x => (categoryOf(x) || null) === cat).sort((a,b) => (a.order||0) - (b.order||0));
  const idx = siblings.findIndex(x => x.id === id);
  const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
  if(swapIdx < 0 || swapIdx >= siblings.length) return;
  const other = siblings[swapIdx];
  const tmp = item.order;
  item.order = other.order;
  other.order = tmp;
}

function goalColor(g){
  if(g.color) return g.color;
  const idx = state.goals.findIndex(x => x.id === g.id);
  return COLORS[Math.max(idx,0) % COLORS.length];
}

function daysRemaining(dateStr){
  const target = new Date(dateStr+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}

function renderHeaderTitle(){
  if(currentGoalId) return;

function collectCategories(){
  const cats = new Set();
  state.goals.forEach(g => { if(g.category) cats.add(g.category); });
  state.countdowns.forEach(c => { if(c.category) cats.add(c.category); });
  return [...cats].sort((a,b)=>a.localeCompare(b,'fr'));
}

    list.innerHTML = cats.map(c => `<div class="autocomplete-item">${escapeHtml(c)}</div>`).join('');
    list.classList.add('open');
  }
  input.addEventListener('focus', showMatches);
  input.addEventListener('input', showMatches);
  input.addEventListener('blur', () => { setTimeout(() => list.classList.remove('open'), 150); });
  list.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.autocomplete-item');
    if(!item) return;
    e.preventDefault();
    input.value = item.textContent;
    list.classList.remove('open');
  });
}

function ringSvg(pct, size, stroke, color){
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const offset = c - (c*pct/100);
  const col = color || 'var(--gold)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(74,59,71,0.1)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg>`;
}

    <div class="goal-body">

      <div class="meta">${dateTxt} · ${n} étape${n>1?'s':''} · ${pct}%</div>

  return div;
}

function renderCategoryChips(containerId, items, filterValue, onSelect){
  const cats = [...new Set(items.map(it => it.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
  const wrap = $(containerId);
  wrap.innerHTML = '';
  if(cats.length === 0){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  ['all', ...cats].forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'filter-chip' + (filterValue === c ? ' active' : '');
    b.textContent = c === 'all' ? 'Toutes' : c;
    b.addEventListener('click', () => onSelect(c));
    wrap.appendChild(b);
  });
}

function renderGroupedList(container, items, filterValue, categoryOf, cardBuilder, emptyHtml){
  container.innerHTML = '';
  if(items.length === 0){
    container.innerHTML = emptyHtml;
    return;
  }
  const filtered = (filterValue === 'all' ? items : items.filter(it => categoryOf(it) === filterValue))
    .slice().sort((a,b) => (a.order||0) - (b.order||0));
  if(filtered.length === 0){
    container.innerHTML = `<div class="empty"><span class="big">🔍</span>Rien dans cette catégorie</div>`;
    return;
  }
  if(filterValue !== 'all'){
    filtered.forEach(it => container.appendChild(cardBuilder(it)));
    return;
  }
  const groups = {};
  filtered.forEach(it => {
    const c = categoryOf(it) || 'Sans catégorie';
    (groups[c] = groups[c] || []).push(it);
  });
  const catNames = Object.keys(groups).sort((a,b) => {
    if(a === 'Sans catégorie') return 1;
    if(b === 'Sans catégorie') return -1;
    return a.localeCompare(b, 'fr');
  });
  catNames.forEach(cat => {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = cat;
    container.appendChild(label);
    groups[cat].forEach(it => container.appendChild(cardBuilder(it)));
  });
}

function renderGoals(){
  renderCategoryChips('goalsFilterChips', state.goals, goalsCatFilter, (c) => { goalsCatFilter = c; renderGoals(); });
  const el = $('goalsList');
  renderGroupedList(
    el, state.goals, goalsCatFilter,

    goalCard,

function renderGoalDetail(goalId){
  const g = state.goals.find(x => x.id === goalId);
  if(!g){ showView('goals'); return; }
  const pct = goalProgress(g);
  const dateTxt = dateRangeText(g, true);
  if(g.photoUrl){
    $('detailPhoto').src = g.photoUrl;
    $('detailPhoto').style.display = 'block';
  } else {
    $('detailPhoto').style.display = 'none';
  }
  $('detailHero').innerHTML = `
    <div class="goal-ring">${ringSvg(pct,64,6,goalColor(g))}<div class="emoji">${g.emoji}</div></div>
    <div>
      <h2>${escapeHtml(g.title)}</h2>
      <div class="meta">${dateTxt} · ${pct}% complété</div>
    </div>
  `;
  const list = $('detailTaskList');
  list.innerHTML = '';
  const tasks = goalTasks(goalId);

    list.innerHTML = `<div class="empty"><span class="big">🪴</span>Aucune étape encore<br>Ajoute la première étape pour faire pousser cet objectif.</div>`;
  } else {
    tasks.forEach(t => list.appendChild(taskRow(t)));
  }
}

function ymd(d){
  const dt = new Date(d);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

function renderCalendar(){
  if(!$('calGrid')) return;
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  const titleTxt = calDate.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  $('calTitle').textContent = titleTxt;
  $('calTitleAgenda').textContent = titleTxt;

  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = ymd(new Date());

  const grid = $('calGrid');
  grid.innerHTML = '';

  for(let i=0; i<startOffset; i++){
    const empty = document.createElement('div');
    empty.className = 'cal-day empty';
    grid.appendChild(empty);
  }

  for(let day=1; day<=daysInMonth; day++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const dayTasks = calFilters.goals ? state.tasks.filter(t => t.date === dateStr) : [];
    const dayCountdowns = calFilters.countdowns ? state.countdowns.filter(cd => cd.date === dateStr) : [];
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (dateStr === todayStr ? ' today' : '');
    cell.dataset.day = dateStr;
    const taskDots = dayTasks.slice(0,5).map(t => {
      const g = state.goals.find(x => x.id === t.goalId);
      const color = g ? goalColor(g) : '#888';
      return t.done
        ? `<span class="cal-dot" style="background:${color}"></span>`
        : `<span class="cal-dot pending" style="border-color:${color}"></span>`;
    }).join('');
    const cdDots = dayCountdowns.slice(0,5).map(cd => `<span class="cal-dot cd" style="background:${cd.color}"></span>`).join('');
    cell.innerHTML = `<div class="num">${day}</div><div class="dots">${taskDots}${cdDots}</div>`;
    grid.appendChild(cell);
  }

  const legend = $('calLegend');
  let legendHtml = '';
  if(calFilters.goals){
    legendHtml += state.goals.map(g => `
      <div class="legend-item"><span class="legend-swatch" style="background:${goalColor(g)}"></span>${g.emoji} ${escapeHtml(g.title)}</div>
    `).join('');
  }
  if(calFilters.countdowns){
    legendHtml += state.countdowns.map(cd => `
      <div class="legend-item"><span class="legend-swatch" style="background:${cd.color}; border-radius:2px; transform:rotate(45deg);"></span>${cd.emoji} ${escapeHtml(cd.title)}</div>
    `).join('');
  }
  legend.innerHTML = legendHtml;
  renderCalAgenda(year, month);
}

function renderCalAgenda(year, month){
  const monthPrefix = year+'-'+String(month+1).padStart(2,'0');
  const items = [];
  if(calFilters.goals){
    state.tasks.filter(t => t.date && t.date.startsWith(monthPrefix)).forEach(t => {
      const g = state.goals.find(x => x.id === t.goalId);
      items.push({ date: t.date, type: 'task', data: t, goal: g });
    });
  }
  if(calFilters.countdowns){
    state.countdowns.filter(cd => cd.date && cd.date.startsWith(monthPrefix)).forEach(cd => {
      items.push({ date: cd.date, type: 'countdown', data: cd });
    });
  }
  const container = $('calAgendaList');
  if(!container) return;
  container.innerHTML = '';
  if(items.length === 0){
    container.innerHTML = `<div class="empty"><span class="big">🗓️</span>Rien de prévu ce mois-ci</div>`;
    return;
  }
  const groups = {};
  items.forEach(it => { (groups[it.date] = groups[it.date] || []).push(it); });
  Object.keys(groups).sort().forEach(dateStr => {
    const label = document.createElement('div');
    label.className = 'section-label';
    const d = new Date(dateStr+'T00:00:00');
    label.textContent = d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
    container.appendChild(label);
    groups[dateStr].forEach(it => {
      if(it.type === 'countdown'){
        container.appendChild(cdCard(it.data));
      } else {
        const row = taskRow(it.data);
        if(it.goal){
          const tag = document.createElement('div');
          tag.className = 'tag';
          tag.style.color = goalColor(it.goal);
          tag.textContent = `${it.goal.emoji} ${it.goal.title}`;
          row.querySelector('.task-txt').appendChild(tag);
        }
        container.appendChild(row);
      }
    });
  });
}

function openDaySheet(dateStr){
  const dayTasks = calFilters.goals ? state.tasks.filter(t => t.date === dateStr) : [];
  const dayCountdowns = calFilters.countdowns ? state.countdowns.filter(cd => cd.date === dateStr) : [];
  const d = new Date(dateStr);
  $('daySheetTitle').textContent = d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  const list = $('daySheetList');
  list.innerHTML = '';
  if(dayTasks.length === 0 && dayCountdowns.length === 0){
    list.innerHTML = `<div class="day-sheet-empty">Rien de prévu ce jour-là</div>`;
  } else {
    dayCountdowns.forEach(cd => list.appendChild(cdCard(cd)));
    dayTasks.forEach(t => {
      const g = state.goals.find(x => x.id === t.goalId);
      const row = taskRow(t);
      if(g){
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.style.color = goalColor(g);
        tag.textContent = `${g.emoji} ${g.title}`;
        row.querySelector('.task-txt').appendChild(tag);
      }
      list.appendChild(row);
    });
  }
  $('overlayDay').classList.add('open');
}


function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('view-'+name).classList.add('active');
  $('backBtn').style.display = (name === 'goal-detail') ? 'inline-block' : 'none';
  $('headerTitle').style.display = (name === 'goal-detail') ? 'none' : 'block';
  $('headerSub').style.display = (name === 'goal-detail') ? 'none' : 'block';
  if(name !== 'goal-detail') currentGoalId = null;
  const navName = (name === 'goal-detail') ? 'goals' : name;
  currentTopView = navName;
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('active', b.dataset.view === navName));
  renderHeaderSub();
  renderHeaderTitle();
  $('fabBtn').style.display = (name === 'calendar') ? 'none' : 'flex';
  if(name === 'calendar') renderCalendar();
}

function openGoalDetail(id){
  currentGoalId = id;
  showView('goal-detail');
  renderGoalDetail(id);
}

$('backBtn').addEventListener('click', () => showView('goals'));

$('headerTitle').addEventListener('click', () => {
  if(currentGoalId) return; // pas d'édition sur la page détail d'un objectif
  const h1 = $('headerTitle');
  if(h1.querySelector('input')) return; // déjà en édition
  const currentText = h1.textContent;
  h1.textContent = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentText;
  input.maxLength = 30;
  h1.appendChild(input);
  input.focus();
  input.select();
  let committed = false;
  const commit = () => {
    if(committed) return;
    committed = true;
    const val = input.value.trim() || DEFAULT_TITLES[currentTopView];
    state.titles[currentTopView] = val;
    saveState();
    renderHeaderTitle();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') input.blur(); });
});

document.querySelectorAll('nav.bottom button').forEach(btn => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});

$('calPrev').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()-1); renderCalendar(); });
$('calNext').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()+1); renderCalendar(); });
$('calPrevAgenda').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()-1); renderCalendar(); });
$('calNextAgenda').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()+1); renderCalendar(); });

function updateCalViewMode(){
  $('calMonthView').style.display = calViewMode === 'month' ? 'block' : 'none';
  $('calAgendaView').style.display = calViewMode === 'agenda' ? 'block' : 'none';
  $('calViewMonth').classList.toggle('active', calViewMode === 'month');
  $('calViewAgenda').classList.toggle('active', calViewMode === 'agenda');
}
$('calViewMonth').addEventListener('click', () => { calViewMode = 'month'; updateCalViewMode(); });
$('calViewAgenda').addEventListener('click', () => { calViewMode = 'agenda'; updateCalViewMode(); });
$('cancelDay').addEventListener('click', () => $('overlayDay').classList.remove('open'));

$('filterGoals').addEventListener('click', () => {
  calFilters.goals = !calFilters.goals;
  $('filterGoals').classList.toggle('active', calFilters.goals);
  renderCalendar();
});
$('filterCountdowns').addEventListener('click', () => {
  calFilters.countdowns = !calFilters.countdowns;
  $('filterCountdowns').classList.toggle('active', calFilters.countdowns);
  renderCalendar();
});

// ---- delegated clicks ----
document.addEventListener('click', (e) => {
  const moveBtn = e.target.closest('[data-move]');
  if(moveBtn){
    const id = moveBtn.dataset.moveId;
    const dir = moveBtn.dataset.move;
    if(moveBtn.dataset.moveType === 'goal'){
      reorderItem(state.goals, g => g.category, id, dir);
      saveState(); renderGoals();
    } else {
      reorderItem(state.countdowns, cd => cd.category, id, dir);
      saveState(); renderCountdowns();
    }
    return;
  }
  const openGoal = e.target.closest('[data-open-goal]');
  if(openGoal && !e.target.closest('[data-toggle]') && !e.target.closest('[data-del-task]')){
    openGoalDetail(openGoal.dataset.openGoal);
    return;
  }
  const dayCell = e.target.closest('.cal-day[data-day]');
  if(dayCell){
    openDaySheet(dayCell.dataset.day);
    return;
  }
  const editCd = e.target.closest('[data-edit-countdown]');
  if(editCd && !e.target.closest('[data-del-countdown]')){
    openCountdownModal(editCd.dataset.editCountdown);
    return;
  }
  const delCd = e.target.closest('[data-del-countdown]');
  if(delCd){
    state.countdowns = state.countdowns.filter(x => x.id !== delCd.dataset.delCountdown);
    saveState(); render();
    return;
  }
  const toggle = e.target.closest('[data-toggle]');
  if(toggle){
    const t = state.tasks.find(x => x.id === toggle.dataset.toggle);
    if(t){ t.done = !t.done; saveState(); render(); }
    return;
  }
  const editTask = e.target.closest('[data-edit-task]');
  if(editTask){
    openTaskModal(null, editTask.dataset.editTask);
    return;
  }
  const delTask = e.target.closest('[data-del-task]');
  if(delTask){
    state.tasks = state.tasks.filter(x => x.id !== delTask.dataset.delTask);
    saveState(); render();
    return;
  }
});

// ---- FAB ----
function openGoalModal(editId){
  editingGoalId = editId || null;
  const editingGoal = editId ? state.goals.find(g => g.id === editId) : null;
  document.getElementById('goalSheetTitle').textContent = editingGoal ? "Modifier l'objectif" : 'Nouvel objectif';
  $('saveGoal').textContent = editingGoal ? 'Enregistrer' : 'Créer';

  selectedEmoji = editingGoal ? editingGoal.emoji : EMOJIS[0];
  selectedColor = editingGoal ? goalColor(editingGoal) : COLORS[state.goals.length % COLORS.length];
  buildEmojiPicker('goalEmojiPicker', selectedEmoji, (v)=>selectedEmoji=v, 'goalEmojiCustom');
  $('goalEmojiCustom').value = EMOJIS.includes(selectedEmoji) ? '' : selectedEmoji;
  buildColorPicker('goalColorPicker', selectedColor, (v)=>selectedColor=v);

  $('goalTitle').value = editingGoal ? editingGoal.title : '';
  $('goalCategory').value = editingGoal ? (editingGoal.category || '') : '';
  $('goalStartDate').value = editingGoal ? (editingGoal.startDate || '') : '';
  $('goalDate').value = editingGoal ? (editingGoal.date || '') : '';
  pendingGoalPhoto = editingGoal ? (editingGoal.photoUrl || null) : null;
  resetPhotoField('goalPhotoPreview', 'goalPhotoImg', 'goalPhotoAddBtn', pendingGoalPhoto);
  $('overlayGoal').classList.add('open');
}

$('fabBtn').addEventListener('click', () => {
  if(currentGoalId){
    openTaskModal(currentGoalId);
  } else if(currentTopView === 'countdowns'){
    openCountdownModal();
  } else {
    openGoalModal();
  }
});
$('editGoalBtn').addEventListener('click', () => openGoalModal(currentGoalId));
$('cancelGoal').addEventListener('click', () => $('overlayGoal').classList.remove('open'));

$('addTaskInlineBtn').addEventListener('click', () => openTaskModal(currentGoalId));

function openTaskModal(preselectGoalId, editId){
  if(state.goals.length === 0 && !editId){
    openGoalModal();
    return;
  }
  editingTaskId = editId || null;
  const editingTask = editId ? state.tasks.find(t => t.id === editId) : null;
  const sel = $('taskGoal');
  sel.innerHTML = state.goals.map(g=>`<option value="${g.id}">${g.emoji} ${escapeHtml(g.title)}</option>`).join('');

  document.getElementById('taskSheetTitle').textContent = editingTask ? "Modifier l'étape" : 'Nouvelle étape';
  $('saveTask').textContent = editingTask ? 'Enregistrer' : 'Créer';

  if(editingTask){
    sel.value = editingTask.goalId;
    $('taskGoalField').style.display = 'block';
    $('taskTitle').value = editingTask.title;
    $('taskDate').value = editingTask.date || '';
  } else {
    if(preselectGoalId) sel.value = preselectGoalId;
    $('taskGoalField').style.display = preselectGoalId ? 'none' : 'block';
    $('taskTitle').value = '';
    $('taskDate').value = '';
  }
  $('overlayTask').classList.add('open');
}
$('cancelTask').addEventListener('click', () => $('overlayTask').classList.remove('open'));

function buildEmojiPicker(containerId, current, onSelect, customInputId){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  EMOJIS.forEach(em => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = em;
    if(em === current) b.classList.add('sel');
    b.addEventListener('click', () => {
      onSelect(em);
      wrap.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      if(customInputId){ const ci = document.getElementById(customInputId); if(ci) ci.value = ''; }
    });
    wrap.appendChild(b);
  });
}

function setupCustomEmojiInput(inputId, pickerContainerId, onSelect){
  const input = document.getElementById(inputId);
  input.addEventListener('input', () => {
    const val = input.value.trim();
    if(val){
      onSelect(val);
      document.getElementById(pickerContainerId).querySelectorAll('button').forEach(b => b.classList.remove('sel'));
    }
  });
}

function buildColorPicker(containerId, current, onSelect){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  COLORS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.style.background = c;
    if(c === current) b.classList.add('sel');
    b.addEventListener('click', () => {
      onSelect(c);
      wrap.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
    });
    wrap.appendChild(b);
  });
}

$('saveGoal').addEventListener('click', () => {
  const title = $('goalTitle').value.trim();
  if(!title) return;
  const category = $('goalCategory').value.trim() || null;
  const startDate = $('goalStartDate').value || null;
  const endDate = $('goalDate').value || null;
  if(startDate && endDate && startDate > endDate){
    alert("La date de début doit être avant la date de fin.");
    return;
  }
  if(editingGoalId){
    const g = state.goals.find(x => x.id === editingGoalId);
    if(g){ g.title = title; g.category = category; g.startDate = startDate; g.date = endDate; g.emoji = selectedEmoji; g.color = selectedColor; g.photoUrl = pendingGoalPhoto; }
  } else {
    state.goals.push({ id: uid(), title, category, startDate, date: endDate, emoji: selectedEmoji, color: selectedColor, photoUrl: pendingGoalPhoto, order: Date.now() });
  }
  editingGoalId = null;
  saveState(); render();
  $('overlayGoal').classList.remove('open');
});

$('saveTask').addEventListener('click', () => {
  const title = $('taskTitle').value.trim();
  const goalId = $('taskGoal').value;
  const date = $('taskDate').value || null;
  if(!title || !goalId) return;
  if(editingTaskId){
    const t = state.tasks.find(x => x.id === editingTaskId);
    if(t){ t.title = title; t.goalId = goalId; t.date = date; }
  } else {
    state.tasks.push({ id: uid(), title, done:false, goalId, date });
  }
  editingTaskId = null;
  saveState(); render();
  $('overlayTask').classList.remove('open');
});

function openCountdownModal(editId){
  editingCountdownId = editId || null;
  const editingCd = editId ? state.countdowns.find(c => c.id === editId) : null;
  document.getElementById('cdSheetTitle').textContent = editingCd ? 'Modifier le compte à rebours' : 'Nouveau compte à rebours';
  $('saveCountdown').textContent = editingCd ? 'Enregistrer' : 'Créer';

  selectedCdEmoji = editingCd ? editingCd.emoji : '⏳';
  selectedCdColor = editingCd ? editingCd.color : COLORS[state.countdowns.length % COLORS.length];
  buildEmojiPicker('cdEmojiPicker', selectedCdEmoji, (v)=>selectedCdEmoji=v, 'cdEmojiCustom');
  $('cdEmojiCustom').value = EMOJIS.includes(selectedCdEmoji) ? '' : selectedCdEmoji;
  buildColorPicker('cdColorPicker', selectedCdColor, (v)=>selectedCdColor=v);

  $('cdTitle').value = editingCd ? editingCd.title : '';
  $('cdCategory').value = editingCd ? (editingCd.category || '') : '';
  $('cdDate').value = editingCd ? editingCd.date : '';
  pendingCdPhoto = editingCd ? (editingCd.photoUrl || null) : null;
  resetPhotoField('cdPhotoPreview', 'cdPhotoImg', 'cdPhotoAddBtn', pendingCdPhoto);
  $('overlayCountdown').classList.add('open');
}
$('cancelCountdown').addEventListener('click', () => $('overlayCountdown').classList.remove('open'));

$('saveCountdown').addEventListener('click', () => {
  const title = $('cdTitle').value.trim();
  const category = $('cdCategory').value.trim() || null;
  const date = $('cdDate').value;
  if(!title || !date) return;
  if(editingCountdownId){
    const cd = state.countdowns.find(x => x.id === editingCountdownId);
    if(cd){ cd.title = title; cd.category = category; cd.date = date; cd.emoji = selectedCdEmoji; cd.color = selectedCdColor; cd.photoUrl = pendingCdPhoto; }
  } else {
    state.countdowns.push({ id: uid(), title, category, date, emoji: selectedCdEmoji, color: selectedCdColor, photoUrl: pendingCdPhoto, order: Date.now() });
  }
  editingCountdownId = null;
  saveState(); render();
  $('overlayCountdown').classList.remove('open');
});

// close overlay on backdrop click
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', (e) => { if(e.target === ov) ov.classList.remove('open'); });
});

setupCategoryAutocomplete('goalCategory', 'goalCategoryList');
setupCategoryAutocomplete('cdCategory', 'cdCategoryList');
setupPhotoField('goalPhotoInput', 'goalPhotoAddBtn', 'goalPhotoPreview', 'goalPhotoImg', 'goalPhotoRemove', () => pendingGoalPhoto, (v) => pendingGoalPhoto = v);
setupPhotoField('cdPhotoInput', 'cdPhotoAddBtn', 'cdPhotoPreview', 'cdPhotoImg', 'cdPhotoRemove', () => pendingCdPhoto, (v) => pendingCdPhoto = v);
setupCustomEmojiInput('goalEmojiCustom', 'goalEmojiPicker', (v) => selectedEmoji = v);
setupCustomEmojiInput('cdEmojiCustom', 'cdEmojiPicker', (v) => selectedCdEmoji = v);

loadState();
</script>
